<!doctype html><html><head><meta charset="utf-8"><title>My tracking script</title></head>
<body><div id="root">Loading…</div>
<script>
const DATA = {"title": "My tracking script", "posts": [{"n": 1, "author": "OPAuthor_7", "date": "Jan 7, 2024", "body": "<p>I wrote a tiny script to count days:</p>\n<pre><code>days = (today - start).days\nif days &gt; 30:\n    print(&quot;milestone &lt;30&gt; reached&quot;)</code></pre>\n<p>Feel free to use it.</p>"}, {"n": 2, "author": "Helper_A", "date": "Feb 1, 2024", "body": "<p>REPLY-MARKER-7a Nice script!</p>"}]};

setTimeout(function(){
  let h = '<nav class="menu"><a href="/spa/board?p=1">Board</a></nav><h1>' + DATA.title + '</h1><div class="thread">';
  for (const p of DATA.posts) {
    h += '<div class="entry" id="post-' + p.n + '"><div class="byline"><span class="author">' + p.author + '</span> <span class="date">' + p.date + '</span></div>'
       + '<div class="entry-body">' + p.body + '</div></div>';
  }
  h += '</div>';
  document.getElementById('root').innerHTML = h;
}, 50);

</script></body></html>
